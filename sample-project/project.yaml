project:
  name: simple-calc-server
  description: "A minimal HTTP calculator API demo for orc"

milestones:
  - id: m1-http-listener
    name: HTTP Listener
    order: 1
    specs:
      - id: m1-s1-listener
        description: HTTP Listener Setup
        spec_file: sample-project/m1-http-listener-design.md
        task_count: 2
        est_minutes: 5

  - id: m2-calc-api
    name: Calculator API
    order: 2
    depends_on: [m1-http-listener]
    specs:
      - id: m2-s1-calc
        description: Calculator API Implementation
        spec_file: sample-project/m2-calc-api-design.md
        task_count: 2
        est_minutes: 10

  - id: m3-verify
    name: Verification
    order: 3
    depends_on: [m2-calc-api]
    specs:
      - id: m3-s1-verify
        description: Final Verification
        spec_file: sample-project/m3-verify-design.md
        task_count: 2
        est_minutes: 5
