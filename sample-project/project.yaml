project:
  name: simple-http-proxy
  description: "A minimal HTTP forward proxy demo for orc"

milestones:
  - id: m1-http-listener
    name: HTTP Listener
    order: 1
    specs:
      - id: m1-s1-listener
        description: HTTP Listener Setup
        spec_file: sample-project/m1-http-listener-design.md
        task_count: 2
        est_minutes: 15

  - id: m2-forwarding-handler
    name: Forwarding Handler
    order: 2
    depends_on: [m1-http-listener]
    specs:
      - id: m2-s1-proxy
        description: Forward Proxy Implementation
        spec_file: sample-project/m2-forwarding-handler-design.md
        task_count: 3
        est_minutes: 20

  - id: m3-observability
    name: Observability
    order: 3
    depends_on: [m2-forwarding-handler]
    specs:
      - id: m3-s1-obs
        description: Logging and Graceful Shutdown
        spec_file: sample-project/m3-observability-design.md
        task_count: 2
        est_minutes: 15

  - id: m4-verify
    name: Verification
    order: 4
    depends_on: [m3-observability]
    specs:
      - id: m4-s1-verify
        description: Integration Verification
        spec_file: sample-project/m4-verify-design.md
        task_count: 2
        est_minutes: 10
